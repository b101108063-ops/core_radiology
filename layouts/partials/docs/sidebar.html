<div id="chapter-groups"></div>

<script>
(function() {
  var chapterGroupsEl = document.getElementById('chapter-groups');
  if (!chapterGroupsEl) return;

  var chapters = [
    { name: 'Thoracic',       slug: 'thoracic',       first: 10,   last: 95   },
    { name: 'Genitourinary',  slug: 'genitourinary',  first: 166,  last: 209  },
    { name: 'GI',             slug: 'gi',             first: 96,   last: 165  },
    { name: 'Neuro',           slug: 'neuro',           first: 210,  last: 354  },
    { name: 'MSK',             slug: 'msk',             first: 355,  last: 472  },
    { name: 'Ultrasound',      slug: 'ultrasound',      first: 473,  last: 561  },
    { name: 'Nuclear',         slug: 'nuclear',         first: 562,  last: 600  },
    { name: 'Breast',          slug: 'breast',          first: 601,  last: 666  },
    { name: 'Cardiovascular',  slug: 'cardiovascular',  first: 667,  last: 703  },
    { name: 'Interventional',  slug: 'interventional',  first: 703,  last: 749  },
    { name: 'Pediatric',       slug: 'pediatric',       first: 750,  last: 846  },
    { name: 'Physics',         slug: 'physics',         first: 847,  last: 873  }
  ];

  chapters.forEach(function(ch) {
    var count = ch.last - ch.first + 1;
    var a = document.createElement('a');
    a.href = '/core_radiology/docs/' + ch.slug + '/';
    a.className = 'chapter-link';
    a.innerHTML = '<span class="ch-name">' + ch.name + '</span><span class="ch-range">p.' + ch.first + '-' + ch.last + ' (' + count + ')</span>';
    chapterGroupsEl.appendChild(a);
  });
})();
</script>
