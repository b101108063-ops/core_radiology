<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} - Core Radiology</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; }
    .layout { display: flex; min-height: 100vh; }
    .content-area { flex: 1; padding: 2rem; max-width: 900px; margin: 0 auto; }
    .main-content { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .hero { background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #2b6cb0 100%); color: white; padding: 3rem 2rem; border-radius: 12px; margin-bottom: 2rem; text-align: center; }
    .hero h1 { font-size: 2.2rem; margin-bottom: 0.5rem; color: white; }
    .hero p { font-size: 1.1rem; opacity: 0.9; margin: 0; }
    .hero .author { font-size: 0.9rem; opacity: 0.7; margin-top: 0.5rem; }
    .chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin: 2rem 0; }
    .chapter-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; text-decoration: none; color: #2d3748; transition: all 0.2s; }
    .chapter-card:hover { border-color: #4299e1; box-shadow: 0 4px 12px rgba(66,153,225,0.3); transform: translateY(-2px); }
    .chapter-card h3 { font-size: 1rem; margin-bottom: 0.25rem; color: #1a365d; }
    .chapter-card p { font-size: 0.8rem; color: #718096; }

    /* Sidebar */
    .sidebar { width: 280px; min-width: 280px; background: #1a365d; color: white; padding: 1rem 0; height: 100vh; position: sticky; top: 0; overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar-header { padding: 0.5rem 1rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 0.5rem; }
    .sidebar-site-title a { color: white; text-decoration: none; font-size: 1rem; font-weight: bold; }
    .sidebar-chapter-title { color: rgba(255,255,255,0.6); font-size: 0.7rem; margin-top: 0.25rem; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 0 0.5rem; }
    .chapter-group { margin-bottom: 0.25rem; }
    .chapter-group-header { padding: 0.5rem 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; border-radius: 6px; user-select: none; font-size: 0.85rem; color: rgba(255,255,255,0.9); }
    .chapter-group-header:hover { background: rgba(255,255,255,0.08); }
    .chapter-group-header .arrow { font-size: 0.6rem; transition: transform 0.2s; color: rgba(255,255,255,0.5); }
    .chapter-group-header.collapsed .arrow { transform: rotate(-90deg); }
    .chapter-group-items { padding: 0.25rem 0.5rem 0.5rem 1.5rem; }
    .chapter-group-items.collapsed { display: none; }
    .chapter-pages-grid { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 0.25rem; }
    .chapter-pages-grid a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.7rem; padding: 2px 5px; border-radius: 3px; background: rgba(255,255,255,0.08); transition: background 0.15s; }
    .chapter-pages-grid a:hover { background: rgba(255,255,255,0.2); color: white; }
    .chapter-range { color: rgba(255,255,255,0.4); font-size: 0.65rem; margin: 0; }
    @media (max-width: 768px) { .sidebar { display: none; } .content-area { padding: 1rem; } }
  </style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <p class="sidebar-site-title"><a href="/core_radiology/">Core Radiology</a></p>
      <p class="sidebar-chapter-title">Core Radiology - A Visual Approach to Diagnostic Imaging</p>
    </div>
    <div class="sidebar-nav">
      <div id="chapter-groups"></div>
    </div>
  </nav>

  <main class="content-area">
    <article class="main-content">
      {{ .Content }}
    </article>
  </main>
</div>

(function() {
  var chapterGroupsEl = document.getElementById('chapter-groups');
  var chapterOrder = ['thoracic','gi','neuro','msk','ultrasound','nuclear','breast','cardiovascular','interventional','pediatric','physics'];
  var chapterNames = {
    'breast': 'Breast',
    'cardiovascular': 'Cardiovascular',
    'gi': 'GI',
    'interventional': 'Interventional',
    'msk': 'MSK',
    'neuro': 'Neuro',
    'nuclear': 'Nuclear',
    'pediatric': 'Pediatric',
    'physics': 'Physics',
    'thoracic': 'Thoracic',
    'ultrasound': 'Ultrasound'
  };

  chapterOrder.forEach(function(ch) {
    if (!IMAGE_DATA[ch]) return;
    var pages = IMAGE_DATA[ch].pages;
    var firstPage = pages[0];
    var lastPage = pages[pages.length - 1];

    var groupEl = document.createElement('div');
    groupEl.className = 'chapter-group';

    var headerEl = document.createElement('div');
    headerEl.className = 'chapter-group-header collapsed';
    headerEl.innerHTML = '<span class="arrow">&#9660;</span>' + chapterNames[ch] + ' <span style="color:rgba(255,255,255,0.5);font-size:0.65rem">(' + pages.length + ' pages)</span>';

    var itemsEl = document.createElement('div');
    itemsEl.className = 'chapter-group-items collapsed';

    var gridEl = document.createElement('div');
    gridEl.className = 'chapter-pages-grid';

    pages.forEach(function(pageNum) {
      var a = document.createElement('a');
      a.href = '/core_radiology/docs/' + ch + '/' + pageNum;
      a.className = 'image-link';
      a.textContent = pageNum;
      gridEl.appendChild(a);
    });

    itemsEl.appendChild(gridEl);

    var rangeEl = document.createElement('p');
    rangeEl.className = 'chapter-range';
    rangeEl.textContent = firstPage + ' - ' + lastPage;
    itemsEl.appendChild(rangeEl);

    headerEl.addEventListener('click', function() {
      var isCollapsed = itemsEl.classList.contains('collapsed');
      itemsEl.classList.toggle('collapsed');
      headerEl.classList.toggle('collapsed', !isCollapsed);
      if (!isCollapsed) {
        itemsEl.style.maxHeight = itemsEl.scrollHeight + 'px';
        setTimeout(function() { itemsEl.style.maxHeight = 'none'; }, 310);
      } else {
        itemsEl.style.maxHeight = itemsEl.scrollHeight + 'px';
        requestAnimationFrame(function() { itemsEl.classList.add('collapsed'); });
      }
    });

    groupEl.appendChild(headerEl);
    groupEl.appendChild(itemsEl);
    chapterGroupsEl.appendChild(groupEl);
  });
})();

</body>
</html>
