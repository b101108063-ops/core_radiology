name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Patch Hugo Book theme - sort sections by weight
        run: |
          git clone https://github.com/alex-shpak/hugo-book themes/hugo-book

          # Sort sections by weight by patching menu-filetree.html
          # Find the line "{{ range (where .Section.Pages" and replace with sorted version
          cd themes/hugo-book/layouts/_partials/docs

          # Backup original
          cp menu-filetree.html menu-filetree.html.bak
          cp title.html title.html.bak

          # Patch book-section-children to sort by weight
          python3 << 'PYEOF'
          with open('menu-filetree.html', 'r') as f:
              content = f.read()

          old = '''{{ define "book-section-children" }}{{/* (dict "Section" .Section "CurrentPage" .CurrentPage) */}}
  <ul>
    {{ range (where .Section.Pages "Params.bookHidden" "ne" true) }}'''

          new = '''{{ define "book-section-children" }}
{{ $ordered := slice }}
{{ range (where .Section.Pages "Params.bookHidden" "ne" true) }}
  {{ $weight := 9999 }}
  {{ with .Params.weight }}{{ $weight = . }}{{ end }}
  {{ $ordered = $ordered | append (dict "Page" . "Weight" $weight) }}
{{ end }}
{{ $sorted := slice }}
{{ range sort $ordered "Weight" "asc" }}
  {{ $sorted = $sorted | append .Page }}
{{ end }}
  <ul>
    {{ range $sorted }}'''

          content = content.replace(old, new)

          # Also fix the closing - need to close the extra range loop
          # The original closes with {{ end }} for the range, we need to close the sort range too
          old2 = '    {{ range (where .Section.Pages "Params.bookHidden" "ne" true) }}'
          content = content.replace(old2, '')

          with open('menu-filetree.html', 'w') as f:
              f.write(content)
          print("Patched menu-filetree.html")
          PYEOF

          # Patch title.html to remove "Chapter X:" prefix
          echo '{{- $title := .Title -}}
{{- $title = replaceRE "^Chapter\s+\d+:\s*" "" $title -}}
{{- return $title -}}' > title.html

      - name: Build
        run: hugo

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
