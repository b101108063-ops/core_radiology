name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Clone Hugo Book theme
        run: |
          git clone --depth 1 https://github.com/alex-shpak/hugo-book.git themes/hugo-book

      - name: Patch Hugo Book theme - sort sections by weight
        run: |
          # Write sorted menu-filetree.html using printf
          printf '%%s\n' \
            '{{ with (partialCached "docs/menu-section" .Site) }}' \
            '  {{ template "book-section-children" (dict "Section" . "CurrentPage" $) }}' \
            '{{ end }}' \
            '' \
            '{{ define "book-section-children" }}' \
            '{{ $ordered := slice }}' \
            '{{ range (where .Section.Pages "Params.bookHidden" "ne" true) }}' \
            '  {{ $weight := 9999 }}' \
            '  {{ with .Params.weight }}{{ $weight = . }}{{ end }}' \
            '  {{ $ordered = $ordered | append (dict "Page" . "Weight" $weight) }}' \
            '{{ end }}' \
            '{{ $sorted := slice }}' \
            '{{ range sort $ordered "Weight" "asc" }}' \
            '  {{ $sorted = $sorted | append .Page }}' \
            '{{ end }}' \
            '  <ul>' \
            '    {{ range $sorted }}' \
            '      {{ if .IsSection }}' \
            '        <li {{- if .Params.BookFlatSection }} class="book-section-flat" {{ end -}}>' \
            '          {{ template "book-page-link" (dict "Page" . "CurrentPage" $.CurrentPage) }}' \
            '          {{ template "book-section-children" (dict "Section" . "CurrentPage" $.CurrentPage) }}' \
            '        </li>' \
            '      {{ else if and .IsPage .Content }}' \
            '        <li>' \
            '          {{ template "book-page-link" (dict "Page" . "CurrentPage" $.CurrentPage) }}' \
            '        </li>' \
            '      {{ end }}' \
            '    {{ end }}' \
            '  </ul>' \
            '{{ end }}' \
            '' \
            '{{ define "book-page-link" }}' \
            '  {{ $current := eq .CurrentPage .Page }}' \
            '  {{ $ancestor := .Page.IsAncestor .CurrentPage }}' \
            '  {{ if .Page.Params.BookCollapseSection }}' \
            '    <input type="checkbox" id="section-{{ md5 .Page }}" class="toggle" {{ if or $current $ancestor }}checked{{ end }} />' \
            '    <label for="section-{{ md5 .Page }}" class="flex">' \
            '      <a {{ if .Page.Content }}href="{{ .Page.RelPermalink }}"{{ else }}role="button"{{ end }} class="{{ if $current }}active{{ end }}">' \
            '        {{ template "book-icon-title" .Page -}}' \
            '      </a>' \
            '      <img src="{{ partial "docs/icon" "chevron-right" }}" class="book-icon" alt="{{ partial "docs/text/i18n" "Expand" }}" />' \
            '    </label>' \
            '  {{ else if .Page.Params.BookHref }}' \
            '    <a href="{{ .Page.Params.BookHref }}" class="{{ if $current }}active{{ end }}" target="_blank" rel="noopener">' \
            '      {{ template "book-icon-title" .Page -}}' \
            '    </a>' \
            '  {{ else if .Page.Content }}' \
            '    <a href="{{ .Page.RelPermalink }}" class="{{ if $current }}active{{ end }}">' \
            '      {{ template "book-icon-title" .Page -}}' \
            '    </a>' \
            '  {{ else }}' \
            '    <a>' \
            '      {{ template "book-icon-title" .Page -}}' \
            '    </a>' \
            '  {{ end }}' \
            '{{ end }}' \
            '' \
            '{{ define "book-icon-title" }}' \
            '{{- with .Page.Params.BookIcon -}}' \
            '  <img src="{{ partial "docs/icon" . }}" class="book-icon" alt="{{ partial "docs/text/i18n" . }}" />' \
            '{{- end -}}' \
            '{{- partial "docs/title" .Page -}}' \
            '{{ end }}' \
            > themes/hugo-book/layouts/_partials/docs/menu-filetree.html

          # Patch title.html to remove Chapter X: prefix
          printf '%%s\n' \
            '{{ $title := .Title }}' \
            '{{ $title = replaceRE "^Chapter\\s+\\d+:\\s*" "" $title }}' \
            '{{ return $title }}' \
            > themes/hugo-book/layouts/_partials/docs/title.html

      - name: Build
        run: hugo

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
